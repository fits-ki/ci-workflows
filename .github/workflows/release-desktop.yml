name: Release desktop

# Call only from a workflow triggered by a version tag matching v*.
# Callers that need signing material pass inherited secrets; see the README.
# build-cmd is bash and must leave release files in dist/ at the repo root.
# This file stores no credentials.

on:
  workflow_call:
    inputs:
      build-matrix:
        description: "JSON array of runner labels, for example [\"ubuntu-24.04\",\"windows-2022\",\"macos-15\"]"
        required: true
        type: string
      build-cmd:
        description: "Bash build command. Must write release files into dist/."
        required: true
        type: string
      artifact-name:
        description: "Artifact name prefix. The uploaded name is <artifact-name>-<runner>."
        required: true
        type: string
      timeout:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 75

permissions:
  contents: read

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.build-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build
        shell: bash
        env:
          BUILD_CMD: ${{ inputs.build-cmd }}
        run: bash -eo pipefail -c "$BUILD_CMD"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error
