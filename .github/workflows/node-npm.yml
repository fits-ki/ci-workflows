name: Node npm checks

on:
  workflow_call:
    inputs:
      node-version:
        default: "24"
        type: string
      php-version:
        description: "Optional PHP version required by the verification script"
        default: ""
        type: string
      check-script:
        description: "Name of the package.json verification script"
        default: "verify"
        type: string
      runner:
        description: "JSON runs-on value (string or array), decoded with fromJSON. Fallback: '\"ubuntu-latest\"'"
        required: false
        type: string
        default: '["self-hosted", "linux", "generic"]'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    steps:
      - name: Check out the caller's tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      # The setup-php action always calls sudo and fails on a self-hosted
      # runner without sudo (bare metal). There, use the host's PHP.
      - name: Use native PHP (self-hosted)
        if: ${{ inputs.php-version != '' && runner.environment == 'self-hosted' }}
        env:
          PHP_VERSION: ${{ inputs.php-version }}
        run: |
          # /opt/php/<version>/bin/php: generic runners (vps-dev-runner,
          # static 8.3/8.4, 8.5 linked); /usr/bin/php<version>: Ubuntu packages.
          php_bin=""
          for candidate in "/opt/php/${PHP_VERSION}/bin/php" "/usr/bin/php${PHP_VERSION}"; do
            if [ -x "$candidate" ]; then
              php_bin="$candidate"
              break
            fi
          done
          if [ -z "$php_bin" ]; then
            echo "::error::PHP ${PHP_VERSION} fehlt auf diesem self-hosted Runner (/opt/php/${PHP_VERSION}/bin/php oder /usr/bin/php${PHP_VERSION}; setup-php braucht sudo)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$php_bin" "$RUNNER_TEMP/bin/php"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$php_bin" -v
          command -v composer

      - name: Set up optional PHP
        if: ${{ inputs.php-version != '' && runner.environment == 'github-hosted' }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
      - name: Install the committed dependency graph
        run: npm ci --no-audit --no-fund
      - name: Verify
        env:
          CHECK_SCRIPT: ${{ inputs.check-script }}
        run: |
          case "$CHECK_SCRIPT" in
            ""|-*|*[!a-zA-Z0-9:_-]*)
              echo "::error::Invalid package script name"
              exit 1
              ;;
          esac
          npm run "$CHECK_SCRIPT"
